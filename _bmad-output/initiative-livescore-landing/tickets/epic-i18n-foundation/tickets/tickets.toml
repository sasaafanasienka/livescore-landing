# epic-i18n-foundation stories — build order. Approved path 2026-11-09.

[[entry]]
id = 1
type = "story"
title = "next-intl locale shell with host and bot CTA"
description = "Installs next-intl App Router [locale] routing for ar/en/es/fr/pt/ru (pt→pt-BR), sets siteUrl to football-live-bot.online, applies ar RTL, and shows a Live Score nav/footer shell with primary CTA to LiveScoreAppBot on the locale home (placeholder body). R5 part: shell + CTA only — no locale switcher."
verify = "Each of /ar /en /es /fr /pt /ru returns 200; /ar is RTL; page metadata/base uses https://football-live-bot.online; home shows Live Score chrome and a t.me/LiveScoreAppBot CTA."
covers = ["R1", "R2", "R5"]
after = []
hitl = true
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Accept-Language redirect from /"
description = "Root / negotiates Accept-Language and redirects to the matching locale prefix, falling back to /en, without permanently locking crawlers to one locale."
verify = "Request / with Accept-Language: ru redirects to a /ru URL; request / without a usable language preference redirects to /en."
covers = ["R3"]
after = [1]
hitl = false
risk = "high"

[[entry]]
