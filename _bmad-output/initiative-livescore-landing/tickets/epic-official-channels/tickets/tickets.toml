# epic-official-channels stories — build order. Approved 2026-11-10 (autopilot).

[[entry]]
id = 1
type = "story"
title = "Official channels BFF and live list on en"
description = "Tracer: thin vertical slice — contract type { id, title, logo, link }, Next.js Route Handler GET /api/official-channels (nodejs) with an upstream adapter (OFFICIAL_CHANNELS_API_URL, OFFICIAL_CHANNELS_REVALIDATE default 300, AbortSignal timeout ~5s, tags [official-channels]), unconfigured mode { data: { items: [] }, mode: unconfigured }, OFFICIAL_CHANNELS_FIXTURE=1 fixture mode, and the live list rendered over the existing /en/official-channels slot with en list labels; md keeps only the shell."
verify = "pnpm exec next build passes; with $env:OFFICIAL_CHANNELS_FIXTURE='1' pnpm exec next start -p 4310, GET /en/official-channels shows the fixture titles and https://t.me/... links and GET /api/official-channels returns { data: { items }, mode: \"fixture\" } with upstream order preserved; with both env vars unset the same GET returns items [] and mode \"unconfigured\" and the page shows the empty state; a pnpm dlx tsx assert over .next/static finds no /api/channels string in client chunks and the response shape matches the { id, title, logo, link } type."
covers = ["R1", "R4", "R5", "R6", "R10"]
after = []
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Public upstream channels endpoint and degradation"
description = "Least-certain: writes the recorded upstream contract and the ready patch docs/upstream/live-score-public-channels.patch (GET /api/public/channels, no auth, listOwnerChannels) for the live-score owner, wires the adapter to a real stub upstream via OFFICIAL_CHANNELS_API_URL, adds a contract-shape test against that stub, and makes timeout/500/malformed responses degrade to a usable 200 error state instead of failing the page."
verify = "docs/upstream/live-score-public-channels.patch exists and its diff adds app.get(\"/api/public/channels\") calling listOwnerChannels without the auth middleware; start a stub serving the contract on :4399 (pnpm dlx tsx), set $env:OFFICIAL_CHANNELS_API_URL='http://127.0.0.1:4399/api/public/channels', pnpm exec next start -p 4311, GET /api/official-channels returns the stub items in order; stop the stub (or return 500 / hang past the timeout) and GET /en/official-channels still returns 200 with the error state text and no stack trace; pnpm dlx tsx contract asserts pass against the stub payload."
covers = ["R2", "R3", "R5"]
after = [1]
hitl = false
risk = "high"

